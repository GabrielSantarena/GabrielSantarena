name: Actualizar tarjetas del README

on:
  schedule:
    - cron: "17 6 * * *" # todos los días, 03:17 hora Argentina
  workflow_dispatch: # botón "Run workflow" para correrlo a mano
  push:
    paths:
      - ".github/workflows/readme-cards.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      THEME: bg_color=0D1117&title_color=2DD4BF&icon_color=38BDF8&text_color=C9D1D9&hide_border=true&border_radius=12

    steps:
      - uses: actions/checkout@v6

      - name: Tarjeta de estadísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=GabrielSantarena&show_icons=true&include_all_commits=true&locale=es&${{ env.THEME }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Actualizar tarjetas del README" || exit 0
          git push
